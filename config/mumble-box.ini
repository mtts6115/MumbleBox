# ==============================================================================
# MumbleBox Default Server Configuration
# Optimized for Android Box / ARM Single-Board Computers
# ==============================================================================

# Database storage file
database=/data/data/com.termux/files/home/.mumblebox/mumble-server.sqlite

# Log file
logfile=/data/data/com.termux/files/home/.mumblebox/mumble-server.log

# Port to bind (Default Mumble Port: 64738 TCP & UDP)
port=64738

# Network interface to bind to (leave empty for all interfaces)
host=

# Server password (leave empty if anyone can connect, or set a room password)
serverpassword=

# Maximum number of concurrent users
users=50

# Maximum bandwidth per user in bits per second (72000 = high quality Opus, very light on network)
bandwidth=72000

# Server welcome message (HTML format supported)
welcometext="<br />Welcome to <b>MumbleBox</b> Server!<br />Hosted seamlessly on an Android Box.<br />"

# Enable Opus codec (Standard high quality low latency audio)
opusthreshold=100

# Channel settings
channelname=[MumbleBox] Lobby
channelnestinglimit=5
defaultchannel=1

# Security & Permissions
bonjour=True
sendversion=True
allowhtml=true
suggestversion=true

# Keep alive interval in seconds
timeout=30

